<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thinking</title>
<style>
:root{
  --bg:#0B111C;
  --bg-2:#111A2B;
  --line:rgba(255,255,255,.11);
  --ink:#E9E4D8;
  --ink-2:#A3AEBE;
  --ink-3:#6E7A8C;
  --l1:#A48BFF;
  --l2:#5B9BC9;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font);font-size:15px;line-height:1.78;
  -webkit-font-smoothing:antialiased;letter-spacing:.01em;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
a{color:inherit;text-decoration:none}

.hero{text-align:center;padding:0 28px 48px}
.hero__t{
  font-size:clamp(32px,5vw,52px);font-weight:500;line-height:1.25;
  letter-spacing:-.02em;margin-bottom:12px;
}
.hero__sub{font-size:15.5px;color:var(--ink-2);max-width:420px;margin:0 auto}

.cards{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;max-width:680px;width:100%;padding:0 28px;
}
.card{
  display:block;background:var(--bg-2);border:1px solid var(--line);
  border-radius:14px;padding:32px 28px;
  transition:border-color .25s var(--ease),transform .25s var(--ease);
}
.card:hover{border-color:rgba(255,255,255,.22);transform:translateY(-3px)}
.card__tag{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
  color:var(--ink-3);margin-bottom:10px;text-transform:uppercase;
}
.card__title{font-size:20px;font-weight:500;letter-spacing:-.01em;margin-bottom:8px}
.card__desc{font-size:14px;color:var(--ink-2);line-height:1.7}
.card--ai .card__tag{color:var(--l1)}
.card--db .card__tag{color:var(--l2)}
.card__links{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.card__links a{
  display:block;font-size:13.5px;color:var(--ink-2);
  padding:6px 10px;border-radius:8px;
  transition:background .2s var(--ease),color .2s var(--ease);
}
.card__links a:hover{background:rgba(255,255,255,.06);color:var(--ink)}

.footer{
  margin-top:56px;padding:20px 28px;text-align:center;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-3);
}
</style>
</head>
<body>

<div class="hero">
  <h1 class="hero__t">Thinking</h1>
  <p class="hero__sub">记录与沉淀——关于 AI、关于讨论、关于思考本身</p>
</div>

<nav class="cards">
  <a class="card card--ai" href="aboutAI/index.html">
    <div class="card__tag">About AI</div>
    <div class="card__title">关于 AI 的六次追问</div>
    <div class="card__desc">半径越大，中心越重要。围绕 AI 展开的主题分析与卡片阅读。</div>
  </a>
  <div class="card card--db">
    <div class="card__tag">Discuss Baseline</div>
    <div class="card__title">Discussion Quality Framework</div>
    <div class="card__desc">讨论质量框架——如何评估一场讨论的质量。</div>
    <div class="card__links">
      <a href="discuss_baseline/Discussion-Quality-Framework-wbd/index.html">wbd 版</a>
      <a href="discuss_baseline/Discussion-Quality-Framework-db/index.html">db 版</a>
      <a href="discuss_baseline/discussion_quality_framework_gpt.html">GPT 版</a>
      <a href="discuss_baseline/discussion_quality_framework_hy4.html">HY4 版</a>
      <a href="discuss_baseline/discussion_quality_framework_db.html">DB 单页版</a>
    </div>
  </div>
</nav>

<div class="footer">zhuangnd &middot; thinking</div>

</body>
</html>
